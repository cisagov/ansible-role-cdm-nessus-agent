---
# A dictionary whose keys are values of the Ansible fact
# ansible_architecture and whose values are processor architecture for
# which Nessus is to be installed, as specified in the Nessus package
# filename
architectures:
  aarch64: aarch64
  x86_64: amd64

# The name of the S3 object corresponding to the Nessus Agent system
# package
package_object_name: NessusAgent-{{ cdm_nessus_agent_version }}-ubuntu1404_{{ architectures[ansible_architecture] }}.deb
